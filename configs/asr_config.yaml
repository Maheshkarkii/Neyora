# Nepali ASR Pipeline Configuration
data:
  raw_dir: 'data/raw/asr'
  processed_dir: 'data/processed/asr'
  target_sample_rate: 16000
  dev_mode: true
  dev_sample_limit: 200
  min_duration_sec: 0.5
  max_duration_sec: 15.0
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  random_seed: 42

features:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  f_min: 0.0
  f_max: 8000.0

dataloader:
  batch_size: 8
  shuffle: true
  num_workers: 0
  pin_memory: false

vocab:
  blank_token: '<blank>'
  unk_token: '<unk>'
  pad_token: '<pad>'
  space_token: '|'
