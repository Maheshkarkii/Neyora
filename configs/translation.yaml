# Phase 2: Nepali-to-English LSTM Encoder-Decoder Configuration

model:
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.2

training:
  learning_rate: 0.001
  batch_size: 8
  epochs: 50
  teacher_forcing_ratio: 0.5
  gradient_clip_max_norm: 1.0
  device: "auto" # "auto", "cuda", or "cpu"
  checkpoint_dir: "checkpoints"
  checkpoint_filename: "best_translation_model.pt"

inference:
  max_output_length: 30

data:
  metadata_dir: "data/metadata"
  processed_dir: "data/processed/translation"
  train_csv: "data/metadata/translation_train.csv"
  val_csv: "data/metadata/translation_val.csv"
  test_csv: "data/metadata/translation_test.csv"
  src_vocab_path: "data/processed/translation/src_vocab.json"
  tgt_vocab_path: "data/processed/translation/tgt_vocab.json"
