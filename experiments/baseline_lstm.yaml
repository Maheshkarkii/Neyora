# Experiment 1: Baseline LSTM Seq2Seq (Phase 2)
model_name: "baseline_lstm"
has_attention: false
dataset_version: "v1.0"
dataset_size: 1000

model:
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.2

training:
  learning_rate: 0.001
  batch_size: 8
  epochs: 50
  teacher_forcing_ratio: 0.5
  gradient_clip_max_norm: 1.0

results:
  val_loss: 4.0065
  test_loss: 4.0275
  bleu_score: 0.00
