# Experiment 2: LSTM Seq2Seq with Bahdanau Additive Attention (Phase 3)
model_name: "lstm_attention"
has_attention: true
attention_type: "bahdanau_additive"
dataset_version: "v1.0"
dataset_size: 1000

model:
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.2

training:
  learning_rate: 0.001
  batch_size: 8
  epochs: 50
  teacher_forcing_ratio: 0.5
  gradient_clip_max_norm: 1.0
  checkpoint_dir: "checkpoints"
  checkpoint_filename: "best_lstm_attention.pt"

inference:
  max_output_length: 30
