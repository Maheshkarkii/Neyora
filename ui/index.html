<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepali Voice Translator — Phase 5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #10b981;
            --nepali-badge: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 720px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            color: var(--text-main);
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 14px;
        }
        .upload-section {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            margin-bottom: 20px;
        }
        .upload-section:hover {
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.05);
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .btn:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }
        .results-box {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-content {
            font-size: 18px;
            line-height: 1.5;
            color: var(--text-main);
            min-height: 28px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .stat-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--success);
        }
        .error-message {
            margin-top: 16px;
            padding: 12px;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Nepali Voice Translator 🇬🇧</h1>
        <p class="subtitle">End-to-End Speech Recognition (CNN-BiLSTM-CTC) &amp; Attention NMT (Seq2Seq)</p>

        <div class="upload-section" onclick="document.getElementById('audioInput').click()">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
            <div id="fileLabel" style="font-weight: 500; font-size: 15px;">Click to select Nepali audio file (.wav)</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Supports 16kHz mono WAV audio</div>
        </div>
        <input type="file" id="audioInput" accept=".wav,.flac,.ogg,.mp3" onchange="handleFileSelected(event)">

        <button id="translateBtn" class="btn" onclick="submitTranslation()" disabled>
            Translate Voice
        </button>

        <div id="errorMessage" class="error-message"></div>

        <div class="results-box" id="resultsBox" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span>🇳🇵 Nepali ASR Transcription</span>
                </div>
                <div id="transcriptionText" class="card-content">...</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span>🇬🇧 English Translation</span>
                </div>
                <div id="translationText" class="card-content">...</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Audio Duration</div>
                    <div id="durationStat" class="stat-value">0.0s</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Inference Latency</div>
                    <div id="latencyStat" class="stat-value">0.0s</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Real-Time Factor</div>
                    <div id="rtfStat" class="stat-value">0.00</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function handleFileSelected(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                selectedFile = files[0];
                document.getElementById('fileLabel').textContent = `Selected: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
                document.getElementById('translateBtn').disabled = false;
                document.getElementById('errorMessage').style.display = 'none';
            }
        }

        async function submitTranslation() {
            if (!selectedFile) return;

            const btn = document.getElementById('translateBtn');
            const errorBox = document.getElementById('errorMessage');
            const resultsBox = document.getElementById('resultsBox');
            
            btn.disabled = true;
            btn.textContent = 'Translating...';
            errorBox.style.display = 'none';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Translation request failed');
                }

                const data = await response.json();
                document.getElementById('transcriptionText').textContent = data.transcription || '(No speech detected)';
                document.getElementById('translationText').textContent = data.translation || '(No translation output)';
                document.getElementById('durationStat').textContent = `${data.audio_duration_sec.toFixed(2)}s`;
                document.getElementById('latencyStat').textContent = `${data.latency_sec.toFixed(3)}s`;
                document.getElementById('rtfStat').textContent = data.real_time_factor.toFixed(3);

                resultsBox.style.display = 'flex';
            } catch (err) {
                errorBox.textContent = `Error: ${err.message}`;
                errorBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Translate Voice';
            }
        }
    </script>
</body>
</html>
